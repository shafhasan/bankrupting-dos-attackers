services:
  trace-experiment:
    build:
      context: .
    image: ddos-trace-experiment:latest
    init: true
    volumes:
      - ./data:/data:ro
      - ./results:/results
    command:
      - /data/${DATASET:-DrDoS_MSSQL.csv}
      - --output-dir
      - /results/${RUN_NAME:-run}
      - --checkpoint-size
      - ${CHECKPOINT_SIZE:-500}
      - --estimator-good-flows
      - ${ESTIMATOR_GOOD_FLOWS:-50}
      - --read-mode
      - ${READ_MODE:-auto}
